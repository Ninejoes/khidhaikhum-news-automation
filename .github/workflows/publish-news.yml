name: News Reel worker

on:
  schedule:
    # Bangkok is UTC+7 year-round. Use UTC explicitly so scheduler behavior
    # does not depend on timezone-aware cron parsing.
    - cron: '25 1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: News queue to process
        type: choice
        options:
          - auto
          - summary
          - breaking
        default: auto
        required: true
      publish:
        description: Publish the selected item to Facebook (otherwise render only)
        type: boolean
        default: false
        required: false
      retry_item_id:
        description: Explicitly retry one saved item with an unconfirmed previous publish
        type: string
        default: ''
        required: false
      item_id:
        description: Target one exact verified newsroom item instead of selecting the queue's newest item
        type: string
        default: ''
        required: false
      delay_seconds:
        description: Wait this many seconds before starting the requested run (maximum 600)
        type: string
        default: '0'
        required: false

permissions:
  contents: read

concurrency:
  group: news-reel-publisher
  cancel-in-progress: false

jobs:
  render-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record scheduled trigger
        if: github.event_name == 'schedule'
        run: |
          echo "Scheduled publisher event received at $(date -u --iso-8601=seconds) UTC"
          echo "Configured schedule: ${{ github.event.schedule }}"

      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Wait before delayed test
        if: github.event_name == 'workflow_dispatch'
        env:
          DELAY_SECONDS: ${{ inputs.delay_seconds || '0' }}
        run: |
          if ! [[ "$DELAY_SECONDS" =~ ^[0-9]{1,3}$ ]]; then
            echo "delay_seconds must be an integer between 0 and 600" >&2
            exit 1
          fi
          delay=$((10#$DELAY_SECONDS))
          if (( delay > 600 )); then
            echo "delay_seconds must not exceed 600" >&2
            exit 1
          fi
          if (( delay > 0 )); then
            echo "Delayed test starts in ${delay} seconds"
            sleep "$delay"
          fi

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install rendering tools and Thai font
        run: |
          sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg libcairo2 libfribidi0 fontconfig fonts-noto-core fonts-dejavu-core
          ffmpeg -version >/dev/null
          fc-match 'Noto Sans Thai' -f '%{file}\n'
          fc-match 'DejaVu Sans' -f '%{file}\n'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Verify Thai text shaping support
        run: |
          .venv/bin/python -c "from PIL import features; print('Pillow RAQM:', features.check('raqm')); assert features.check('raqm'), 'Pillow RAQM and FriBiDi are required for Thai text shaping'"

      - name: Verify topic illustration and SVG icon rendering
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PIL import Image
          from renderer.run import illustration_icon, make_illustration_background

          item = {"category": "เทคโนโลยีและ AI", "title": "ข่าวชิป AI", "summary": "เทคโนโลยี AI"}
          scene = {"label": "ข่าวด่วนที่ตรวจสอบแล้ว", "title": "ชิป AI", "body": "ข่าวเทคโนโลยี AI"}
          assert illustration_icon(item, scene)[0] == "cpu"
          with TemporaryDirectory(prefix="khidhaikhum-illustration-check-") as temporary:
              output = make_illustration_background(Path(temporary), item, scene, 0)
              with Image.open(output) as frame:
                  assert frame.size == (1080, 1920), f"Unexpected illustration size: {frame.size}"
          print("Topic illustration and CPU SVG icon rendered at 1080x1920.")
          PY

      - name: Render and validate without posting
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        env:
          NEWSROOM_URL: ${{ secrets.NEWSROOM_URL }}
          AUTO_PUBLISH_SECRET: ${{ secrets.AUTO_PUBLISH_SECRET }}
          SIWC_BYPASS_TOKEN: ${{ secrets.SIWC_BYPASS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_PROVIDER: gemini
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE: Charon
          REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
          REQUESTED_ITEM_ID: ${{ inputs.item_id || '' }}
        run: .venv/bin/python renderer/run.py --render-only --output outputs/news-reel.mp4

      - name: Upload rendered video preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true && success() && hashFiles('outputs/news-reel.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: news-reel-preview
          path: outputs/news-reel.mp4
          if-no-files-found: error
          retention-days: 1

      - name: Render and publish to Facebook
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          NEWSROOM_URL: ${{ secrets.NEWSROOM_URL }}
          AUTO_PUBLISH_SECRET: ${{ secrets.AUTO_PUBLISH_SECRET }}
          SIWC_BYPASS_TOKEN: ${{ secrets.SIWC_BYPASS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_PROVIDER: gemini
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE: Charon
          REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
          RETRY_ITEM_ID: ${{ inputs.retry_item_id || '' }}
          REQUESTED_ITEM_ID: ${{ inputs.item_id || '' }}
        run: .venv/bin/python renderer/run.py

      - name: Remove temporary media and logs
        if: always()
        run: |
          rm -rf outputs
          rm -rf renderer/work
          find "${TMPDIR:-/tmp}" -maxdepth 1 -type d -name 'khidhaikhum-news-*' -exec rm -rf {} +
