name: Temporary schedule smoke check

on:
  schedule:
    - cron: '40 7 * * *'
      timezone: Asia/Bangkok

permissions:
  contents: read

jobs:
  verify-scheduler:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled event reached GitHub runner
        run: echo "GitHub schedule event reached the hosted runner at $(date -u --iso-8601=seconds)"
